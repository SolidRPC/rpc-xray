name: rpc-xray

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${RPC_XRAY_TARGETS:-./targets.yml}:/etc/prometheus/targets.yml:ro
      - ../alerts/rpc-xray.rules.yml:/etc/prometheus/rpc-xray.rules.yml:ro
      - prometheus:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9090:9090

  alertmanager:
    image: prom/alertmanager:v0.28.1
    entrypoint:
      - /bin/sh
      - -c
      - |
        config=/etc/alertmanager/disabled.yml
        if [ -n "$$SLACK_WEBHOOK_URL" ]; then
          printf %s "$$SLACK_WEBHOOK_URL" > /tmp/slack_url
          config=/etc/alertmanager/alertmanager.yml
        fi
        exec /bin/alertmanager --config.file="$$config" --storage.path=/alertmanager --data.retention=744h --web.external-url="$$ALERTMANAGER_EXTERNAL_URL"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERTMANAGER_EXTERNAL_URL: ${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager.disabled.yml:/etc/alertmanager/disabled.yml:ro
      - alertmanager:/alertmanager
    ports:
      - 127.0.0.1:9093:9093

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rpc-xray.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards/rpc-xray.json:/var/lib/grafana/dashboards/rpc-xray.json:ro
      - grafana:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000

  demo:
    profiles: [demo]
    image: node:22-alpine
    working_dir: /repo/examples
    command: node demo.mjs
    volumes:
      - ..:/repo:ro

volumes:
  prometheus:
  alertmanager:
  grafana:
