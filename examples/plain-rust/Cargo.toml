[package]
name = "rpc-xray-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
solidrpc-rpc-xray = { version = "0.1.1" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
axum = "0.8"
