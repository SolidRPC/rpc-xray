[package]
name = "rpc-xray-alloy-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
solidrpc-rpc-xray = { path = "../../rust", features = ["alloy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
axum = "0.8"
alloy = { version = "2.5", default-features = false, features = ["providers", "rpc-client", "reqwest-rustls-tls"] }
