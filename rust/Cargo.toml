[package]
name = "solidrpc-rpc-xray"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Prometheus metrics for HTTP JSON-RPC clients"
repository = "https://github.com/SolidRPC/rpc-xray"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest", "dep:bytes", "dep:futures-util"]
alloy = ["reqwest", "dep:alloy-json-rpc", "dep:alloy-transport", "dep:tower"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"], optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
alloy-json-rpc = { version = "2.5", optional = true }
alloy-transport = { version = "2.5", optional = true }
tower = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
alloy = { version = "2.5", default-features = false, features = ["providers", "rpc-client", "reqwest-rustls-tls"] }
