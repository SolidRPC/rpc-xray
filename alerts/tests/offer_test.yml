rule_files:
  - ../rpc-xray.rules.yml

evaluation_interval: 5m

tests:
  - name: the offer needs volume, an incident, and offers enabled
    interval: 1m
    input_series:
      - series: 'rpc_xray_requests_total{chain="ethereum", provider="a.example", method="eth_call", outcome="ok"}'
        values: "0+2400x10080"
      - series: 'rpc_xray_requests_total{chain="ethereum", provider="a.example", method="eth_call", outcome="http_error"}'
        values: "0+0x9000 0+2400x60 144000+0x1019"
      - series: "rpc_xray_offers_enabled"
        values: "1x10080"
    alert_rule_test:
      - eval_time: 8000m
        alertname: RpcXrayTrialOffer
        exp_alerts: []
      - eval_time: 10080m
        alertname: RpcXrayTrialOffer
        exp_alerts:
          - exp_labels:
              severity: info
              rpc_xray: offer
            exp_annotations:
              summary: "You send about 104.3M RPC requests a month and had incidents this week"
              description: "SolidRPC offers a 14-day free trial or $100 credit. Email hello@solidrpc.io and mention rpc-xray. Set offers: false in rpc-xray to stop this message."

  - name: the offer stays quiet when offers are turned off
    interval: 1m
    input_series:
      - series: 'rpc_xray_requests_total{chain="ethereum", provider="a.example", method="eth_call", outcome="ok"}'
        values: "0+2400x10080"
      - series: 'rpc_xray_requests_total{chain="ethereum", provider="a.example", method="eth_call", outcome="http_error"}'
        values: "0+0x9000 0+2400x60 144000+0x1019"
      - series: "rpc_xray_offers_enabled"
        values: "0x10080"
    alert_rule_test:
      - eval_time: 10080m
        alertname: RpcXrayTrialOffer
        exp_alerts: []
