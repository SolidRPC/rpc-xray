rule_files:
  - ../rpc-xray.rules.yml

evaluation_interval: 30s

tests:
  - name: healthy endpoints need no pre-created error counters
    interval: 30s
    input_series:
      - series: 'rpc_xray_requests_total{chain="ethereum", provider="healthy.example", method="eth_call", outcome="ok"}'
        values: "0+30x20"
      - series: 'rpc_xray_requests_total{chain="base", provider="failing.example", method="eth_call", outcome="ok"}'
        values: "0+27x20"
      - series: 'rpc_xray_requests_total{chain="base", provider="failing.example", method="eth_call", outcome="http_error"}'
        values: "0+3x20"
      - series: 'rpc_xray_requests_total{chain="bsc", provider="idle.example", method="eth_call", outcome="ok"}'
        values: "10x20"
    promql_expr_test:
      - expr: rpc_xray:success_ratio:rate1h{provider!="idle.example"}
        eval_time: 10m
        exp_samples:
          - labels: 'rpc_xray:success_ratio:rate1h{chain="ethereum", provider="healthy.example"}'
            value: 1
          - labels: 'rpc_xray:success_ratio:rate1h{chain="base", provider="failing.example"}'
            value: 0.9
      - expr: count(rpc_xray:success_ratio:rate1h{provider="idle.example"} != rpc_xray:success_ratio:rate1h{provider="idle.example"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: rpc_xray:failed_requests:rate5m{provider="healthy.example"}
        eval_time: 10m
        exp_samples:
          - labels: 'rpc_xray:failed_requests:rate5m{chain="ethereum", provider="healthy.example"}'
            value: 0
      - expr: rpc_xray:head_lag_seconds
        eval_time: 10m
        exp_samples: []
  - name: absent traffic does not become success or zero failures
    promql_expr_test:
      - expr: rpc_xray:success_ratio:rate1h
        eval_time: 10m
        exp_samples: []
      - expr: rpc_xray:failed_requests:rate5m_total
        eval_time: 10m
        exp_samples: []
