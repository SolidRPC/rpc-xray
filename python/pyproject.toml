[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "solidrpc-rpc-xray"
version = "0.1.1"
description = "Prometheus metrics for HTTP JSON-RPC clients"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
requests = ["requests>=2.32,<3"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "prometheus-client>=0.21", "build>=1.2", "web3>=7,<9", "brotli>=1.1", "zstandard>=0.23"]

[project.urls]
Repository = "https://github.com/SolidRPC/rpc-xray"

[tool.hatch.build.targets.wheel]
packages = ["rpc_xray"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
